services:
  supportflow:
    build: .
    image: supportflow:2.0
    container_name: supportflow
    restart: unless-stopped          # tự chạy lại khi container lỗi hoặc máy khởi động lại
    env_file: .env
    ports:
      - "${PUBLIC_PORT:-8080}:8080"                              # website công khai (chỉ đọc)
      - "${EDITOR_BIND:-127.0.0.1}:${EDITOR_PORT:-8081}:8081"    # Studio biên tập: mặc định chỉ mở trên chính Mac mini
    volumes:
      - ./data:/data                 # bài viết (SQLite) + ảnh/video; không mất khi cập nhật container
    mem_limit: 2g
    cpus: 4
    security_opt: ["no-new-privileges:true"]
    logging:
      options: { max-size: "10m", max-file: "3" }
